services:
  ros:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
      args:
        WORKSPACE_DIR: ${WORKSPACE_DIR}
        USERNAME: ${DEVCONTAINER_USERNAME}
        UID: ${DEVCONTAINER_UID}
        GID: ${DEVCONTAINER_GID}
        UBUNTU_VERSION: ${UBUNTU_VERSION}
    container_name: isdn3000e_ros_devcontainer
    command: sleep infinity
    privileged: true
    shm_size: 512m
    tty: true
    stdin_open: true
    volumes:
      - ../..:/workspace:cached
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'
    environment:
      - DISPLAY=novnc:0.0
      - XDG_RUNTIME_DIR=/tmp/runtime-${DEVCONTAINER_USERNAME}
      - ROS_DOMAIN_ID=42
    ports:
      - "7447:7447"
    networks:
      - x11
    depends_on:
      - novnc

  novnc:
    image: theasp/novnc:latest
    container_name: isdn3000e_novnc
    environment:
      - DISPLAY_WIDTH=1600
      - DISPLAY_HEIGHT=900
      - RUN_XTERM=no
    ports:
      - "8080:8080"
    networks:
      - x11

networks:
  x11:
